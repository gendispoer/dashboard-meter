<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Status Meter - Customer Monitoring</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">💧 Status Meter</div>
    <nav>
      <a href="index.html">Overview</a>
      <a href="monitoring.html" class="active">Customer Monitoring</a>
      <a href="analysis.html">Model Analysis</a>
    </nav>
  </aside>

  <main class="main">
    <div class="page-title">Customer Monitoring</div>
    <div class="page-subtitle">Telusuri pelanggan beserta input model dan hasil prediksinya</div>

    <div class="panel">
      <div class="filters">
        <div class="field">
          <label>Prediksi Status</label>
          <select id="f-status">
            <option value="">Semua</option>
            <option value="Naik">Naik</option>
            <option value="Tetap">Tetap</option>
            <option value="Turun">Turun</option>
          </select>
        </div>
        <div class="field">
          <label>Subzona</label>
          <select id="f-subzona"><option value="">Semua</option></select>
        </div>
        <div class="field">
          <label>KD Tarif</label>
          <select id="f-tarif"><option value="">Semua</option></select>
        </div>
        <div class="field">
          <label>Cari NO_PLG / Nama</label>
          <input type="text" id="f-search" placeholder="ketik untuk mencari...">
        </div>
      </div>

      <div class="row-count" id="row-count"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>NO_PLG</th>
              <th>NAMA</th>
              <th>KD_TARIF</th>
              <th>SUBZONA</th>
              <th>JML_PENGHUNI</th>
              <th>SUMUR</th>
              <th>Pakai &gt;10</th>
              <th>Pakai 0</th>
              <th>Pressure</th>
              <th>Prediksi</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
